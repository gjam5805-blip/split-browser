<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi Screen</title>
<meta name="description" content="Ek page me 6 screens: har screen me Google search aur YouTube video.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='8' width='26' height='22' rx='4' fill='%234dabff'/%3E%3Crect x='34' y='8' width='26' height='22' rx='4' fill='%23ff4d6d'/%3E%3Crect x='4' y='34' width='26' height='22' rx='4' fill='%23ff4d6d'/%3E%3Crect x='34' y='34' width='26' height='22' rx='4' fill='%234dabff'/%3E%3C/svg%3E">
<style>
  :root { --bg: #0d0f13; --bar: #171a21; --line: #2a2f3a; --text: #eef1f6; --muted: #9aa3b2; --g: #4dabff; --yt: #ff4d6d; --gap: 6px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .top b { font-size: 16px; margin-right: 6px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { background: transparent; color: var(--text); border: 0; padding: 7px 12px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--g); color: #fff; }
  .tbtn { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; font: inherit; cursor: pointer; }
  .tbtn:hover { color: var(--text); }
  .grid { flex: 1; display: grid; gap: var(--gap); padding: var(--gap); min-height: 0; }
  .pane { display: flex; flex-direction: column; background: #000; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 0; position: relative; }
  .pane.focus { border-color: var(--g); }
  .pane.hidden { display: none; }
  .grid.maxed .pane:not(.max) { display: none; }
  .grid.maxed { grid-template-columns: 1fr !important; grid-template-rows: 1fr !important; }
  .bar { display: flex; gap: 5px; padding: 5px; background: var(--bar); align-items: center; }
  .num { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border-radius: 6px; background: #0c0e12; color: var(--muted); font-size: 12px; font-weight: 700; }
  .bar input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0c0e12; color: var(--text); font: inherit; }
  .bar input:focus { outline: 2px solid var(--g); border-color: transparent; }
  .ib { flex: none; height: 34px; min-width: 34px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line); background: #0c0e12; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
  .ib:hover { border-color: var(--muted); }
  .ib.g { background: var(--g); border-color: var(--g); color: #fff; }
  .ib.yt { background: var(--yt); border-color: var(--yt); color: #fff; }
  .ib[hidden] { display: none; }
  .view { flex: 1; position: relative; min-height: 0; background: #fff; }
  .view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .list { position: absolute; inset: 0; overflow: auto; background: #111318; padding: 10px; display: none; }
  .list.show { display: block; }
  .list .hd { color: var(--muted); font-size: 13px; margin: 0 2px 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card { background: #1b1f27; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; cursor: pointer; text-align: left; color: var(--text); padding: 0; font: inherit; font-size: 12.5px; }
  .card:hover { border-color: var(--yt); }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .card span { display: block; padding: 6px 8px 2px; line-height: 1.25; }
  .card small { display: block; padding: 0 8px 7px; color: var(--muted); font-size: 11.5px; }
  .ysearch { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ylogo { color: #fff; font-weight: 800; white-space: nowrap; font-size: 15px; }
  .ylogo::first-letter { color: var(--yt); }
  .ysearch input { flex: 1; min-width: 0; padding: 10px 16px; border-radius: 999px; border: 1px solid #3a3f4b; background: #0c0e12; color: var(--text); font: inherit; font-size: 15px; }
  .ysearch input:focus { outline: 2px solid var(--yt); border-color: transparent; }
  .ysearch button { height: 40px; width: 56px; border-radius: 999px; border: 1px solid #3a3f4b; background: #22262f; color: var(--text); font-size: 16px; cursor: pointer; }
  .ysearch button:hover { background: #2c313c; }
  .ychips { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
  .ychips::-webkit-scrollbar { display: none; }
  .ychip { flex: none; white-space: nowrap; background: #1b1f27; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .ychip:hover { border-color: var(--muted); }
  .ychip.on { background: var(--yt); border-color: var(--yt); color: #fff; }
  .tip { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(20,22,28,.92); color: #ffd99a; font-size: 12.5px; padding: 7px 10px; border-radius: 8px; display: none; }
  .tip.show { display: block; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; display: none; align-items: center; gap: 6px; flex-wrap: wrap;
           padding: 8px; background: rgba(15,17,21,.96); border-top: 2px solid var(--yt); color: var(--text); font-size: 13px; }
  .strip.show { display: flex; }
  .strip span { flex: 1; min-width: 150px; color: #ffd99a; }
  .sb { background: #1b1f27; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-weight: 700; cursor: pointer; }
  .sb.ytgo { background: var(--yt); border-color: var(--yt); color: #fff; }
  .sb.back2 { background: var(--g); border-color: var(--g); color: #fff; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr !important; grid-template-rows: none !important; overflow: auto; }
    .pane { height: 75vh; }
  }
</style>
</head>
<body>
  <div class="top">
    <b>Multi Screen</b>
    <div class="seg" id="count"></div>
    <button class="tbtn" id="reset" title="Sab screens wapas Google pe">↺ Sab reset</button>
    <span style="color:var(--muted);font-size:13px">Har screen me: likho → Enter = Google · ▶ = YouTube (isi screen me) · ⤢ = badi screen</span>
  </div>
  <div class="grid" id="grid"></div>

<script>
(() => {
  const N = 6;
  const HOME = 'https://www.google.com/webhp?igu=1';
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ms_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('ms_' + k, JSON.stringify(v)); } catch (e) {} },
  };
  let count = store.get('count', 6);
  const urls = store.get('urls', Array(N).fill(HOME));
  const qs = store.get('qs', Array(N).fill(''));
  // sirf wahi cheezein wapas kholo jo screen ke andar khul sakti hain (youtube.com jaisi refuse wali nahi)
  const canFrame = u => /^https:\/\/www\.google\.com\/(search|webhp)\?igu=1/.test(u || '') || /^https:\/\/www\.youtube\.com\/embed\//.test(u || '');
  const VIDEO_WORDS = /\b(song|songs|gaana|gana|gaane|gane|video|videos|movie|film|trailer|music|lofi|episode|cartoon|highlights|bhajan|status|remix|mashup|jukebox|podcast|stand ?up|comedy)\b/i;
  const grid = document.getElementById('grid');
  const LAYOUT = { 1: [1, 1], 2: [2, 1], 3: [3, 1], 4: [2, 2], 6: [3, 2] };

  // ---- YouTube search (bina API key, public Piped/Invidious servers; jo chale)
  async function j(url) {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), 6000);
    try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }
  const fromPiped = arr => arr.filter(x => x.url && x.url.includes('v=') && !x.isShort)
    .map(x => ({ id: x.url.split('v=')[1].slice(0, 11), title: x.title, ch: x.uploaderName, dur: x.duration }));
  const fromInvid = arr => arr.filter(x => x.videoId)
    .map(x => ({ id: x.videoId, title: x.title, ch: x.author, dur: x.lengthSeconds }));
  const piped = h => ({
    search: async q => fromPiped((await j(`https://${h}/search?q=${encodeURIComponent(q)}&filter=videos`)).items),
    trending: async () => fromPiped(await j(`https://${h}/trending?region=IN`)),
  });
  const invid = h => ({
    search: async q => fromInvid(await j(`https://${h}/api/v1/search?type=video&region=IN&q=${encodeURIComponent(q)}`)),
    trending: async () => fromInvid(await j(`https://${h}/api/v1/trending?region=IN`)),
  });
  const SOURCES = [piped('api.piped.private.coffee'), piped('pipedapi.kavin.rocks'), piped('pipedapi.adminforge.de'),
                   piped('api.piped.yt'), invid('inv.nadeko.net'), invid('yewtu.be')];
  let lastGood = 0;
  async function ask(kind, q) {
    for (let i = 0; i < SOURCES.length; i++) {
      const k = (lastGood + i) % SOURCES.length;
      try { const r = await SOURCES[k][kind](q); if (r && r.length) { lastGood = k; return r.slice(0, 24); } } catch (e) {}
    }
    return [];
  }
  const ytSearch = q => ask('search', q);
  const ytTrending = async () => { const r = await ask('trending'); return r.length ? r : ask('search', 'trending india today'); };
  const CHIPS = [['🔥 Trending', ''], ['🎵 Hindi songs', 'latest hindi songs'], ['🎬 Movie trailers', 'new movie trailer hindi'],
                 ['📰 News', 'hindi news live'], ['😂 Comedy', 'comedy hindi'], ['🧸 Cartoon', 'cartoon hindi'],
                 ['🎧 Lofi', 'lofi hindi songs'], ['🏏 Cricket', 'cricket highlights']];
  const fmt = s => { s = +s || 0; if (!s) return ''; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
  const isYouTubeWord = q => /^(https?:\/\/)?((www|m)\.)?(you ?tube|yt)(\.com)?\/?$/i.test(q.trim());

  function ytEmbed(s) {
    const v = s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
    const l = s.match(/[?&]list=([\w-]+)/);
    if (v) return `https://www.youtube.com/embed/${v[1]}?autoplay=1&rel=0&enablejsapi=1` + (l ? `&list=${l[1]}` : '');
    if (l && /youtu/.test(s)) return `https://www.youtube.com/embed/videoseries?list=${l[1]}&autoplay=1&enablejsapi=1`;
    return null;
  }
  const isUrl = s => /^https?:\/\//i.test(s) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s);
  const googleUrl = q => 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(q);

  const panes = [];
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'pane';
    p.innerHTML = `
      <div class="bar">
        <span class="num">${i + 1}</span>
        <input type="text" placeholder="Search, link, ya youtube…" enterkeyhint="search">
        <button class="ib g" title="Google search">G</button>
        <button class="ib yt" title="YouTube: khali dabao toh trending, likh ke dabao toh search">▶</button>
        <button class="ib back" title="Wapas video list" hidden>☰</button>
        <button class="ib mute" title="Video mute / unmute" hidden>🔇</button>
        <button class="ib max" title="Is screen ko bada karo">⤢</button>
        <button class="ib home" title="Wapas Google">⌂</button>
      </div>
      <div class="view">
        <iframe allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div class="list"></div>
        <div class="tip"></div>
        <div class="strip"><span>Page nahi khula? (YouTube jaisi sites yahan nahi khulti)</span>
          <button class="sb back2">↩ Wapas</button><button class="sb ytgo">▶ YouTube pe dhoondo</button><button class="sb x" title="Band karo">✕</button></div>
      </div>`;
    grid.appendChild(p);
    const el = {
      p, input: p.querySelector('input'), frame: p.querySelector('iframe'), list: p.querySelector('.list'), tip: p.querySelector('.tip'),
      mute: p.querySelector('.mute'), back: p.querySelector('.back'), muted: false, hasList: false, googleTip: false,
    };
    panes.push(el);

    const tip = (t, ms = 5000) => { el.tip.textContent = t; el.tip.classList.add('show'); clearTimeout(el.tt); el.tt = setTimeout(() => el.tip.classList.remove('show'), ms); };
    const yt = (func) => { try { el.frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*'); } catch (e) {} };
    el.strip = p.querySelector('.strip');
    el.expect = 0;
    const load = (url, save = true) => {
      el.list.classList.remove('show');
      el.strip.classList.remove('show');
      el.expect++;
      el.frame.src = url;
      el.lastUrl = url;
      const vid = /youtube\.com\/embed/.test(url);
      el.mute.hidden = !vid;
      el.back.hidden = !(vid && el.hasList);
      el.muted = false; el.mute.textContent = '🔇';
      if (save) { urls[i] = url; qs[i] = el.input.value.trim(); store.set('urls', urls); store.set('qs', qs); }
    };
    el.load = load;
    // Screen ke andar kisi link pe click hua (humne nahi badla) → neeche "Wapas / YouTube" ki patti dikhao
    el.frame.addEventListener('load', () => {
      if (el.expect > 0) { el.expect--; return; }
      if (/youtube\.com\/embed/.test(el.lastUrl || '')) return;
      el.strip.classList.add('show');
    });
    p.querySelector('.back2').onclick = () => load(el.lastUrl || HOME, false);
    p.querySelector('.x').onclick = () => el.strip.classList.remove('show');
    p.querySelector('.ytgo').onclick = () => { el.strip.classList.remove('show'); goYouTube(); };

    // ---- is screen ke andar chhota YouTube: chips + video cards
    const showList = (title, items, chip, query) => {
      el.list.innerHTML = '';
      // YouTube jaisa apna search bar
      const sbar = document.createElement('form');
      sbar.className = 'ysearch';
      sbar.innerHTML = '<span class="ylogo">▶ YouTube</span><input type="search" placeholder="YouTube pe search karo…" enterkeyhint="search"><button type="submit" title="Search">🔍</button>';
      const sin = sbar.querySelector('input');
      sin.value = query || '';
      sbar.onsubmit = e => { e.preventDefault(); const v = sin.value.trim(); if (v) { el.input.value = v; ytFind(v); } else ytHome(); };
      const chips = document.createElement('div');
      chips.className = 'ychips';
      CHIPS.forEach(([label, q]) => {
        const b = document.createElement('button');
        b.className = 'ychip' + (label === chip ? ' on' : '');
        b.textContent = label;
        b.onclick = () => (q ? ytFind(q, label) : ytHome());
        chips.appendChild(b);
      });
      const hd = document.createElement('div');
      hd.className = 'hd'; hd.textContent = title;
      const cards = document.createElement('div');
      cards.className = 'cards';
      items.forEach(v => {
        const b = document.createElement('button');
        b.className = 'card';
        const img = document.createElement('img');
        img.src = `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`; img.alt = ''; img.loading = 'lazy';
        const s = document.createElement('span'); s.textContent = v.title;
        const m = document.createElement('small'); m.textContent = [v.ch, fmt(v.dur)].filter(Boolean).join(' · ');
        b.append(img, s, m);
        b.onclick = () => load(`https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&enablejsapi=1`);
        cards.appendChild(b);
      });
      el.list.append(sbar, chips, hd, cards);
      el.list.classList.add('show');
      el.list.scrollTop = 0;
      if (items.length) el.hasList = true;
      if (!query && !items.length) sin.focus();
    };
    const ytFind = async (q, chip) => {
      const shown = chip ? '' : q;   // category chip ho toh search bar khali rakho
      showList('🔎 YouTube pe dhoondh raha hoon: ' + q, [], chip, shown);
      const res = await ytSearch(q);
      if (!res.length) return showList('😕 YouTube search abhi nahi chala. Thodi der baad dobara try karo, ya kisi video ka link paste karo.', [], chip, shown);
      showList(`"${q}" — jo chalana hai us pe tap karo:`, res, chip, shown);
    };
    const ytHome = async () => {
      showList('🔥 Trending videos la raha hoon…', [], '🔥 Trending');
      const res = await ytTrending();
      if (!res.length) return showList('😕 Trending abhi nahi aaya. Upar search karo ya koi category chuno.', [], '🔥 Trending');
      showList('🔥 India me trending — upar search karo, category chuno, ya video pe tap karo:', res, '🔥 Trending');
    };

    const goGoogle = () => {
      const q = el.input.value.trim();
      if (!q) return load(HOME);
      const emb = ytEmbed(q);
      if (emb) return load(emb);
      if (isYouTubeWord(q)) return ytHome();                       // "youtube" likha → isi screen me YouTube
      if (/\byou ?tube\b|youtu\.be/i.test(q)) {                    // "kesariya youtube" / youtube.com/... → YouTube search
        const rest = q.replace(/(https?:\/\/)?((www|m)\.)?youtube\.com\/?\S*/ig, ' ')
          .replace(/\b(on|pe|par|me)?\s*you ?tube\b/ig, ' ').replace(/\s+/g, ' ').trim();
        return rest ? ytFind(rest) : ytHome();
      }
      if (VIDEO_WORDS.test(q) && !isUrl(q)) return ytFind(q);      // "kesariya song" → seedha YouTube (Google ke YT links yahan nahi khulte)
      if (isUrl(q)) {
        load(/^https?:/i.test(q) ? q : 'https://' + q);
        tip('Kuch websites (jaise instagram) page ke andar khulne nahi deti. Khali dikhe toh G se search karo. Video ke liye ▶.', 7000);
        return;
      }
      load(googleUrl(q));
      if (!el.googleTip) { el.googleTip = true; tip('Google ke YouTube links yahan nahi khulte. Video dekhna ho toh ▶ dabao, YouTube isi screen me chalega.', 6000); }
    };
    const goYouTube = () => {
      const q = el.input.value.trim();
      if (!q || isYouTubeWord(q)) return ytHome();
      const emb = ytEmbed(q);
      if (emb) return load(emb);
      ytFind(q.replace(/\b(on|pe|par|me)?\s*you ?tube\b/ig, ' ').trim() || q);
    };
    el.back.onclick = () => { yt('pauseVideo'); el.list.classList.add('show'); el.back.hidden = true; };
    el.input.addEventListener('keydown', e => { if (e.key === 'Enter') goGoogle(); });
    p.querySelector('.g').onclick = goGoogle;
    p.querySelector('.yt').onclick = goYouTube;
    p.querySelector('.home').onclick = () => { el.input.value = ''; load(HOME); };
    p.querySelector('.max').onclick = () => {
      const on = !p.classList.contains('max');
      panes.forEach(x => x.p.classList.remove('max'));
      grid.classList.toggle('maxed', on);
      if (on) p.classList.add('max');
      p.querySelector('.max').textContent = on ? '⤡' : '⤢';
      panes.forEach(x => { if (x !== el) x.p.querySelector('.max').textContent = '⤢'; });
    };
    el.mute.onclick = () => {
      el.muted = !el.muted;
      yt(el.muted ? 'mute' : 'unMute');
      el.mute.textContent = el.muted ? '🔊' : '🔇';
    };
    p.addEventListener('pointerdown', () => { panes.forEach(x => x.p.classList.remove('focus')); p.classList.add('focus'); });
    el.input.value = canFrame(urls[i]) ? (qs[i] || '') : '';
    load(canFrame(urls[i]) ? urls[i] : HOME, false);
  }

  function layout() {
    const [c, r] = LAYOUT[count] || LAYOUT[6];
    grid.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${r}, 1fr)`;
    panes.forEach((x, i) => x.p.classList.toggle('hidden', i >= count));
    document.querySelectorAll('#count button').forEach(b => b.classList.toggle('on', +b.dataset.n === count));
  }
  [1, 2, 3, 4, 6].forEach(n => {
    const b = document.createElement('button');
    b.textContent = n; b.dataset.n = n; b.title = n + ' screens';
    b.onclick = () => { count = n; store.set('count', n); grid.classList.remove('maxed'); panes.forEach(x => x.p.classList.remove('max')); layout(); };
    document.getElementById('count').appendChild(b);
  });
  document.getElementById('reset').onclick = () => panes.forEach(x => { x.input.value = ''; x.load(HOME); });
  layout();
})();
</script>
</body>
</html>
